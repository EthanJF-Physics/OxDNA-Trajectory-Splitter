[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oxdna-trajectory-splitter"
version = "8.2.0"
description = "A Python tool for validating, indexing, and extracting frames from large oxDNA trajectory files."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "EthanF" }
]
keywords = [
    "oxDNA",
    "molecular-dynamics",
    "trajectory",
    "scientific-computing"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering"
]
dependencies = []

[project.urls]
Repository = "https://github.com/EthanJF-Physics/OxDNA-Trajectory-Splitter"
Issues = "https://github.com/EthanJF-Physics/OxDNA-Trajectory-Splitter/issues"

[project.scripts]
oxdna-splitter = "oxdna_splitter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
