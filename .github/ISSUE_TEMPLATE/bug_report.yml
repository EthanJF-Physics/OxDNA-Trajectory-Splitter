name: Bug report
description: Report a reproducible problem with OxDNA Trajectory Splitter
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: OxDNA Trajectory Splitter version
      placeholder: "8.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / ..."
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Remove private paths or data if necessary.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction details
      description: Describe the smallest input/setup that reproduces the problem. Do not upload sensitive data.
